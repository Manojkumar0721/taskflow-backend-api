# Server Configuration for Tests
server.port=-1

# Use H2 in-memory database with MySQL compatibility mode for rapid, isolated tests
spring.datasource.url=jdbc:h2:mem:taskflow_test_db;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate in tests: create-drop automatically manages test table lifecycles
spring.jpa.generate-ddl=true
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Disable Flyway in unit tests to let Hibernate create tables quickly
spring.flyway.enabled=false
